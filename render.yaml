services:
  - type: web
    name: clima-bot
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python -m gunicorn webapp:app --bind 0.0.0.0:$PORT --workers 1 --worker-class gthread --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: WINDBORNE_API_KEY
        sync: false
      - key: WB_TELEGRAM_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RUN_TELEGRAM_BOT
        value: "1"
